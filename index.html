<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sharma Electricals CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#eef2f9;--surface:#fff;--surface-2:#f5f7fc;--surface-3:#eef1f8;--border:#e2e8f2;--text:#0e1729;--muted:#697b96;--primary:#2f5bea;--primary-2:#1e40af;--primary-soft:#e9efff;--success:#0fa968;--success-soft:#e6f7ef;--warning:#e08700;--warning-soft:#fff4e0;--danger:#e0393e;--danger-soft:#fdeaea;--info:#0d8dd7;--info-soft:#e5f4fd;--purple:#7c3aed;--purple-soft:#f1eafe;--shadow-sm:0 1px 2px rgba(16,24,40,.05);--shadow:0 2px 4px -1px rgba(16,24,40,.06),0 10px 24px -12px rgba(16,24,40,.18);--shadow-lg:0 24px 60px -20px rgba(16,24,40,.35)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.hidden{display:none !important}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:20px}

/* LOGIN */
.login-screen{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0b1c4d 0%,#1b3fa8 45%,#2f5bea 100%);padding:20px}
.login-card{background:#fff;border-radius:20px;padding:44px 40px;width:100%;max-width:420px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.login-card .mark{width:70px;height:70px;border-radius:20px;background:linear-gradient(135deg,#2f5bea,#7c3aed);color:#fff;display:grid;place-items:center;font-size:30px;margin:0 auto 20px}
.login-card h1{font-size:24px;font-weight:800;text-align:center;margin-bottom:6px}
.login-card .tagline{color:#697b96;font-size:13px;text-align:center;margin-bottom:28px}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px;color:#697b96}
.input{width:100%;padding:12px 14px;border:1.5px solid #e2e8f2;border-radius:11px;background:#fff;transition:.18s;font-size:13.5px;outline:none}
.input:focus{border-color:#2f5bea;box-shadow:0 0 0 4px #e9efff}
.login-error{background:#fdeaea;color:#e0393e;padding:11px 14px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:15px;display:none}
.login-error.show{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:11px;font-weight:600;font-size:13.5px;transition:.16s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:#2f5bea;color:#fff;box-shadow:0 6px 18px -8px #2f5bea}
.btn-primary:hover{background:#1e40af}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-ghost{background:#f5f7fc;color:#0e1729;border:1px solid #e2e8f2}
.btn-ghost:hover{background:#eef1f8}
.btn-danger{background:#e0393e;color:#fff}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn-block{width:100%;padding:13px}
.login-hint{text-align:center;font-size:11.5px;color:#697b96;margin-top:18px;line-height:1.6}

/* APP */
.app{display:flex;min-height:100vh}
.sidebar{width:264px;flex:0 0 264px;background:#fff;border-right:1px solid #e2e8f2;height:100vh;position:sticky;top:0;display:flex;flex-direction:column;z-index:70;transition:transform .28s}
.sb-brand{display:flex;align-items:center;gap:12px;padding:18px;border-bottom:1px solid #e2e8f2}
.sb-brand .mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#2f5bea,#6d8dff);color:#fff;font-size:17px;flex:none}
.sb-brand b{font-size:14px;font-weight:800;display:block;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.sb-brand small{font-size:10px;color:#697b96;letter-spacing:.5px;text-transform:uppercase;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;display:block}
.sb-nav{flex:1;overflow-y:auto;padding:12px}
.nav-group>span{display:block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#697b96;padding:14px 12px 7px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9.5px 12px;border-radius:10px;color:#697b96;font-weight:500;font-size:13.3px;cursor:pointer;transition:.16s;margin-bottom:1px}
.nav-item i:first-child{width:18px;text-align:center;font-size:14px}
.nav-item:hover{background:#f5f7fc;color:#0e1729}
.nav-item.active{background:#e9efff;color:#2f5bea;font-weight:700}
.nav-badge{margin-left:auto;background:#e0393e;color:#fff;font-size:10px;font-weight:700;padding:1.5px 7px;border-radius:100px;min-width:20px;text-align:center}
.sb-foot{padding:12px;border-top:1px solid #e2e8f2}
.sb-user{display:flex;align-items:center;gap:10px;padding:9px;border-radius:11px;background:#f5f7fc}
.sb-user .av{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2f5bea,#7c3aed);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.sb-user b{display:block;font-size:12.5px;font-weight:700;line-height:1.25}
.sb-user small{font-size:10.5px;color:#697b96;word-break:break-all}
.mini-btn{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;font-size:11.5px;color:#697b96;background:#f5f7fc;border:1px solid #e2e8f2;transition:.15s}
.mini-btn:hover{color:#2f5bea;border-color:#2f5bea;background:#e9efff}
.mini-btn.danger:hover{color:#e0393e;border-color:#e0393e;background:#fdeaea}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:11px 20px;background:rgba(255,255,255,.85);backdrop-filter:blur(16px);border-bottom:1px solid #e2e8f2}
.tb-title{font-size:15.5px;font-weight:800;line-height:1.2}
.tb-title small{display:block;font-size:11px;font-weight:500;color:#697b96}
.search-wrap{position:relative;flex:1;max-width:440px}
.search-wrap>i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#697b96;font-size:13px}
.search-wrap input{width:100%;padding:9.5px 14px 9.5px 36px;border-radius:11px;border:1.5px solid #e2e8f2;background:#f5f7fc;outline:none;font-size:13px;transition:.18s}
.search-wrap input:focus{border-color:#2f5bea;background:#fff}
.tb-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;position:relative;color:#697b96;transition:.16s;border:1px solid transparent;cursor:pointer}
.icon-btn:hover{background:#f5f7fc;color:#0e1729;border-color:#e2e8f2}
.dot-badge{position:absolute;top:5px;right:5px;min-width:17px;height:17px;padding:0 4px;border-radius:100px;background:#e0393e;color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.av-btn{display:flex;align-items:center;gap:9px;padding:4px 10px 4px 4px;border-radius:11px;transition:.16s;border:1px solid transparent;cursor:pointer}
.av-btn:hover{background:#f5f7fc;border-color:#e2e8f2}
.av-btn .av{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#2f5bea,#7c3aed);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.av-btn .nm{font-size:12.5px;font-weight:700;line-height:1.2;text-align:left}
.av-btn .nm small{display:block;font-size:10px;color:#697b96;font-weight:500}

.content{flex:1;padding:22px 24px 40px;max-width:1700px;width:100%;margin:0 auto}
.page{animation:pageIn .32s}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* CARDS */
.card{background:#fff;border:1px solid #e2e8f2;border-radius:16px;box-shadow:var(--shadow-sm)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid #e2e8f2}
.card-h h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:9px}
.card-h h3 i{color:#2f5bea;font-size:13px}
.card-h small{font-size:11.5px;color:#697b96}
.card-b{padding:18px}
.card-b.tight{padding:0}

.greet{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.greet h2{font-size:25px;font-weight:800;margin-bottom:4px}
.greet p{color:#697b96;font-size:13.5px}
.quick-actions{display:flex;gap:8px;flex-wrap:wrap}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid #e2e8f2;border-radius:16px;padding:15px 16px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm);transition:.28s}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.kpi:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--accent)}
.kpi-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:11px}
.kpi-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:15px}
.delta{font-size:11px;font-weight:700;padding:3px 8px;border-radius:100px;display:inline-flex;align-items:center;gap:4px}
.delta.up{background:#e6f7ef;color:#0fa968}
.delta.down{background:#fdeaea;color:#e0393e}
.kpi-val{font-size:24px;font-weight:800;line-height:1.1;margin-bottom:3px}
.kpi-lbl{font-size:12.5px;font-weight:600;color:#697b96}
.kpi-sub{font-size:10.5px;color:#697b96;margin-top:5px}

/* PIPELINE */
.pipeline{display:grid;grid-template-columns:repeat(7,1fr);gap:11px;padding:18px}
.pipe-stage{background:#f5f7fc;border:1.5px solid #e2e8f2;border-radius:14px;padding:14px;position:relative;cursor:pointer;transition:.24s}
.pipe-stage:hover{transform:translateY(-4px);border-color:var(--sc);box-shadow:0 14px 30px -16px var(--sc)}
.pipe-stage::before{content:'';position:absolute;top:-1.5px;left:14px;right:14px;height:3px;border-radius:0 0 4px 4px;background:var(--sc)}
.pipe-stage .cnt{font-size:21px;font-weight:800;line-height:1}
.pipe-stage .nm{font-size:11.5px;font-weight:600;color:#697b96;margin:5px 0 10px;text-transform:uppercase}
.pipe-stage .val{font-size:12.5px;font-weight:700;color:var(--sc)}
.pbar{height:5px;border-radius:100px;background:#eef1f8;overflow:hidden;margin-top:9px}
.pbar>i{display:block;height:100%;border-radius:100px;background:var(--sc);width:0;transition:width 1.1s}
.pipe-stage .conv{font-size:10px;color:#697b96;margin-top:7px;font-weight:600}

/* GRID */
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-21{grid-template-columns:2fr 1fr}
.mb-16{margin-bottom:16px}
.mb-20{margin-bottom:20px}

/* TABLE */
.tbl-toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:13px 16px;border-bottom:1px solid #e2e8f2}
.tbl-search{position:relative;flex:1;min-width:190px;max-width:300px}
.tbl-search i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#697b96;font-size:12.5px}
.tbl-search input{width:100%;padding:8.5px 12px 8.5px 33px;border-radius:10px;border:1.5px solid #e2e8f2;background:#f5f7fc;outline:none;font-size:12.8px}
.tbl-search input:focus{border-color:#2f5bea;background:#fff}
.tbl-scroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:720px}
table.tbl th{text-align:left;padding:11px 14px;font-size:11px;font-weight:700;text-transform:uppercase;color:#697b96;background:#f5f7fc;border-bottom:1px solid #e2e8f2;white-space:nowrap}
table.tbl td{padding:12px 14px;border-bottom:1px solid #e2e8f2;vertical-align:middle}
table.tbl tbody tr{transition:background .14s}
table.tbl tbody tr:hover{background:#f5f7fc}
.cell-strong{font-weight:700}
.cell-sub{font-size:11px;color:#697b96;display:block;margin-top:1px}
.row-actions{display:flex;gap:5px;justify-content:flex-end}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3.5px 10px;border-radius:100px;font-size:11px;font-weight:700;white-space:nowrap}
.b-blue{background:#e5f4fd;color:#0d8dd7}
.b-green{background:#e6f7ef;color:#0fa968}
.b-amber{background:#fff4e0;color:#e08700}
.b-red{background:#fdeaea;color:#e0393e}
.b-purple{background:#f1eafe;color:#7c3aed}
.b-gray{background:#eef1f8;color:#697b96}
.b-primary{background:#e9efff;color:#2f5bea}
.scope-pill{display:inline-block;padding:2.5px 8px;border-radius:6px;font-size:10.5px;font-weight:600;background:#eef1f8;color:#697b96;margin:1.5px 3px 1.5px 0;border:1px solid #e2e8f2}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(9,16,32,.55);backdrop-filter:blur(5px);z-index:400;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto}
.modal{background:#fff;border-radius:18px;width:100%;max-width:640px;box-shadow:var(--shadow-lg);border:1px solid #e2e8f2;margin:auto}
.modal.lg{max-width:880px}
.modal.sm{max-width:440px}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:17px 20px;border-bottom:1px solid #e2e8f2}
.modal-h h3{font-size:16px;font-weight:800}
.modal-b{padding:20px;max-height:calc(100vh - 240px);overflow-y:auto}
.modal-f{display:flex;justify-content:flex-end;gap:9px;padding:15px 20px;border-top:1px solid #e2e8f2;background:#f5f7fc;border-radius:0 0 18px 18px}
.form-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.fg{grid-column:span 6}
.fg.full{grid-column:span 12}
.fg label{display:block;font-size:11.5px;font-weight:700;margin-bottom:6px;color:#697b96}
.fg label .req{color:#e0393e}
.ms-grid{display:flex;flex-wrap:wrap;gap:7px;padding:10px;border:1.5px solid #e2e8f2;border-radius:11px;background:#f5f7fc;max-height:150px;overflow-y:auto}
.ms-item{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;background:#fff;border:1.5px solid #e2e8f2;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.ms-item:hover{border-color:#2f5bea}
.ms-item.on{background:#e9efff;border-color:#2f5bea;color:#2f5bea}
.ms-item input{display:none}
.form-section-title{grid-column:span 12;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#2f5bea;padding-top:6px;border-top:1px dashed #e2e8f2;margin-top:4px}
.form-section-title:first-child{border-top:none;padding-top:0;margin-top:0}

/* TOAST */
.toast-wrap{position:fixed;top:18px;right:18px;z-index:900;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;padding:13px 17px;border-radius:13px;background:#fff;border:1px solid #e2e8f2;box-shadow:var(--shadow-lg);min-width:280px;max-width:380px;pointer-events:auto;border-left:4px solid var(--tc);animation:toastIn .32s}
@keyframes toastIn{from{opacity:0;transform:translateX(80px)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .3s forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(80px)}}
.toast .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:13px;flex:none;background:var(--tcs);color:var(--tc)}
.toast b{font-size:13px;font-weight:700;display:block}
.toast small{font-size:11.5px;color:#697b96}

.empty{text-align:center;padding:52px 20px;color:#697b96}
.empty i{font-size:40px;opacity:.22;margin-bottom:14px;display:block}
.empty b{display:block;font-size:14.5px;font-weight:700;color:#0e1729;margin-bottom:5px}
.empty p{font-size:12.5px;max-width:320px;margin:0 auto 16px}
.act-list{display:flex;flex-direction:column}
.act-item{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid #e2e8f2;transition:.15s;cursor:pointer}
.act-item:last-child{border-bottom:none}
.act-item:hover{background:#f5f7fc}
.act-item .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:13px;flex:none}
.act-item b{font-size:13px;font-weight:600;display:block;line-height:1.35}
.act-item small{font-size:11.5px;color:#697b96}
.act-item .rt{margin-left:auto;text-align:right;flex:none}
.chart-box{position:relative;width:100%}
.chart-box.h300{height:300px}

@media (max-width:1024px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .content{padding:18px 16px 96px}
  .g-3,.g-21{grid-template-columns:1fr}
  .pipeline{grid-template-columns:repeat(4,1fr)}
  .g-4{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:820px){
  .pipeline{grid-template-columns:repeat(2,1fr)}
  .g-2,.g-4{grid-template-columns:1fr}
  .fg{grid-column:span 12}
  .tb-title{display:none}
  .av-btn .nm{display:none}
  .modal-backdrop{padding:0;align-items:flex-end}
  .modal{max-width:100% !important;border-radius:20px 20px 0 0;max-height:94vh}
  .form-grid{grid-template-columns:1fr}
  .toast-wrap{left:12px;right:12px;top:auto;bottom:20px}
  .toast{min-width:0;max-width:none}
  .mob-only{display:grid !important}
  .dsk-only{display:none !important}
}
@media (max-width:480px){
  .pipeline{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .kpi-val{font-size:20px}
  .greet h2{font-size:20px}
}
.sb-overlay{position:fixed;inset:0;background:rgba(9,16,32,.5);z-index:65;opacity:0;pointer-events:none;transition:.25s}
.sb-overlay.on{opacity:1;pointer-events:auto}
.mob-only{display:none}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="mark"><i class="fa-solid fa-bolt"></i></div>
    <h1 id="loginCompanyName">Sharma Electricals</h1>
    <p class="tagline" id="loginTagline">MEP Contracting Specialists</p>
    <div class="login-error" id="loginError"></div>
    <div class="field">
      <label>Email Address</label>
      <input class="input" id="loginEmail" type="email" placeholder="you@company.com" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input class="input" id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-block" id="loginBtn" onclick="handleLogin()">
      <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
    </button>
    <p class="login-hint">Contact your administrator for credentials</p>
  </div>
</div>

<!-- APP -->
<div class="app hidden" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="mark"><i class="fa-solid fa-bolt"></i></div>
      <div style="flex:1;min-width:0">
        <b id="sbCompany">Sharma Electricals</b>
        <small id="sbTagline">MEP Contracting Specialists</small>
      </div>
      <button class="mini-btn mob-only" onclick="toggleSidebar(false)"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <nav class="sb-nav" id="sbNav"></nav>
    <div class="sb-foot">
      <div class="sb-user">
        <div class="av" id="sbAv">A</div>
        <div style="flex:1;min-width:0">
          <b id="sbName">Admin</b>
          <small id="sbEmail">admin@mepcrm.com</small>
        </div>
        <button class="mini-btn" onclick="handleLogout()" title="Logout"><i class="fa-solid fa-power-off"></i></button>
      </div>
    </div>
  </aside>

function animateCounters(root) {
  $$('[data-count]', root).forEach(function(el) {
    var target = parseFloat(el.dataset.count) || 0;
    var isMoney = el.dataset.money === '1';
    var dur = 850, start = performance.now();
    function step(t) {
      var p = clamp((t - start) / dur, 0, 1);
      var e = 1 - Math.pow(1 - p, 3);
      var v = target * e;
      el.textContent = isMoney ? money(v) : Math.round(v).toLocaleString('en-IN');
      if (p < 1) requestAnimationFrame(step);
      else el.textContent = isMoney ? money(target) : Math.round(target).toLocaleString('en-IN');
    }
    requestAnimationFrame(step);
  });
}

    return '<div class="' + span + '"><label>' + esc(f.label) + (f.req ? ' <span class="req">*</span>' : '') + '</label><select class="input" data-f="' + f.key + '">' + (f.options || []).map(function(o) { return '<option value="' + esc(o) + '"' + (String(val) === String(o) ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select></div>';
  }
  if (f.type === 'textarea') {
    return '<div class="' + span + '"><label>' + esc(f.label) + '</label><textarea class="input" data-f="' + f.key + '" rows="3" placeholder="' + esc(f.ph || '') + '">' + esc(val) + '</textarea></div>';
  }
  return '<div class="' + span + '"><label>' + esc(f.label) + (f.req ? ' <span class="req">*</span>' : '') + '</label><input class="input" type="' + (f.type || 'text') + '" data-f="' + f.key + '" value="' + esc(val) + '" placeholder="' + esc(f.ph || '') + '"></div>';
}
function readForm(root) {
  var out = {};
  $$('[data-f]', root).forEach(function(el) { out[el.dataset.f] = el.type === 'number' ? Number(el.value || 0) : el.value; });
  var groups = {};
  $$('[data-ms]', root).forEach(function(el) {
    var k = el.dataset.ms;
    if (!groups[k]) groups[k] = [];
    if (el.checked) groups[k].push(el.value);
  });
  Object.keys(groups).forEach(function(k) { out[k] = groups[k]; });
  return out;
}

function openEntityForm(module, id) {
  var cfg = ENTITIES[module];
  if (!cfg) return;
  var rec = id ? DB[cfg.table].find(function(x) { return x.id === id; }) : null;
  var isNew = !rec;
  if (!rec) rec = cfg.blank();
  var title = (isNew ? '<i class="fa-solid fa-plus" style="color:#2f5bea"></i> New ' : '<i class="fa-solid fa-pen" style="color:#2f5bea"></i> Edit ') + cfg.title;
  var body = '<div class="form-grid" id="entityForm">' + cfg.fields.map(function(f) { return fieldHTML(f, rec); }).join('') + '</div>';
  var footer = '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveEntity(\'' + module + '\',\'' + (id || '') + '\')"><i class="fa-solid fa-check"></i> ' + (isNew ? 'Create' : 'Update') + '</button>';
  openModal(title, body, footer, cfg.size || '');
}

async function saveEntity(module, id) {
  var cfg = ENTITIES[module];
  var data = readForm($('#entityForm'));
  var required = cfg.fields.filter(function(f) { return f.req; });
  for (var i = 0; i < required.length; i++) {
    if (!String(data[required[i].key] == null ? '' : data[required[i].key]).trim()) {
      toast('Required', required[i].label + ' is required', 'error');
      return;
    }
  }
  var table = TABLE_MAP[module];
  if (cfg.beforeSave) cfg.beforeSave(data);
  var payload = toSnake(data);

  try {
    if (id) {
      var r1 = await supabase.from(table).update(payload).eq('id', id);
      if (r1.error) throw r1.error;
      toast('Updated ✅', cfg.title + ' saved', 'success');
    } else {
      payload.id = genId(cfg.prefix);
      if (!payload.created_at) payload.created_at = toISO(today());
      var r2 = await supabase.from(table).insert(payload);
      if (r2.error) throw r2.error;
      toast('Created ✅', cfg.title + ' ' + payload.id, 'success');
    }
    closeModal();
    await loadDB();
    render();
  } catch (e) {
    console.error(e);
    toast('Save failed', e.message, 'error');
  }
}

function deleteEntity(module, id) {
  var cfg = ENTITIES[module];
  var rec = DB[cfg.table].find(function(x) { return x.id === id; });
  openModal('Confirm Delete',

}
async function confirmDelete(module, id) {
  var table = TABLE_MAP[module];
  try {

    if (r.error) throw r.error;
    closeModal();

    render();

}

async function completeFollowup(id) {

    await loadDB();
    render();
    toast('Completed', 'Follow-up done', 'success');

}

async function toggleTask(id) {
  var t = DB.tasks.find(function(x) { return x.id === id; });
  if (!t) return;
  var ns = t.status === 'Completed' ? 'Pending' : 'Completed';
  try {
    var r = await supabase.from('tasks').update({ status: ns }).eq('id', id);
    if (r.error) throw r.error;
    await loadDB();
    render();
  } catch (e) { toast('Failed', e.message, 'error'); }
}

function renderSimpleTable(module) {
  var cfg = ENTITIES[module];
  var rows = DB[cfg.table];
  var el = document.getElementById(module + 'Table');
  if (!el) return;
  if (!rows.length) { el.innerHTML = emptyState('fa-inbox', 'No ' + cfg.title + 's yet', 'Click "New ' + cfg.title + '" to add'); return; }
  var cols = Object.keys(rows[0]).filter(function(k) { return !['scope','created_at','updated_at'].includes(k); }).slice(0, 7);
  var html = '<table class="tbl"><thead><tr>';
  cols.forEach(function(c) { html += '<th>' + c.replace(/_/g,' ').toUpperCase() + '</th>'; });
  html += '<th style="text-align:right">Actions</th></tr></thead><tbody>';
  rows.forEach(function(r) {
    html += '<tr>';
    cols.forEach(function(c) {
      var v = r[c];
      if (Array.isArray(v)) v = v.join(', ');
      if (typeof v === 'object') v = '';
      html += '<td>' + esc(String(v == null ? '—' : v).slice(0, 60)) + '</td>';
    });
    html += '<td><div class="row-actions">' +
      '<button class="mini-btn" onclick="openEntityForm(\'' + module + '\',\'' + esc(r.id) + '\')"><i class="fa-solid fa-pen"></i></button>' +
      '<button class="mini-btn danger" onclick="deleteEntity(\'' + module + '\',\'' + esc(r.id) + '\')"><i class="fa-solid fa-trash"></i></button>' +
    '</div></td></tr>';
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

function filterTable(q, module) {
  var cfg = ENTITIES[module];
  var allRows = DB[cfg.table];
  if (!q) { DB[cfg.table] = allRows; renderSimpleTable(module); return; }
  var ql = q.toLowerCase();
  var filtered = allRows.filter(function(r) {
    return Object.values(r).some(function(v) { return String(v || '').toLowerCase().indexOf(ql) >= 0; });
  });
  var orig = DB[cfg.table];
  DB[cfg.table] = filtered;
  renderSimpleTable(module);
  DB[cfg.table] = orig;
}

async function handleSaveCompany() {
  try {
    await saveCompany({
      company_name: $('#setCompanyName').value.trim() || 'Company',
      tagline: $('#setTagline').value.trim(),
      full_name: $('#setFullName').value.trim(),
      gst: $('#setGst').value.trim(),
      phone: $('#setPhone').value.trim(),
      email: $('#setEmail').value.trim(),
      address: $('#setAddress').value.trim()
    });
    toast('Saved ✅', 'Company profile updated', 'success');
    render();
  } catch (e) {
    toast('Save failed', e.message, 'error');
  }
}

/* BOOT */
async function boot() {
  try {
    console.log('%c🚀 ' + (state.company.company_name || 'MEP') + ' CRM ready', 'color:#2f5bea;font-weight:800;font-size:14px');
    var sess = await supabase.auth.getSession();
    if (sess.data && sess.data.session) {
      state.user = sess.data.session.user;
      await afterLogin();
    } else {
      await loadCompany();
      applyCompanyToUI();
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
      if (e.key === 'Enter' && !$('#loginScreen').classList.contains('hidden')) handleLogin();
    });
  } catch (e) {
    console.error('Boot error:', e);
  }
}
boot();
